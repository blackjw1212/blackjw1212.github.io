name: Update market feed

on:
  workflow_dispatch:
  schedule:
    # **GitHub 的排程不準時，而且差很多。** 2026-10-12～11-11 每一班的實際開跑時間（run 的
    # created_at）比 cron 晚 4.5～10 小時，天天如此：
    #   cron（UTC）   設計的台灣時間     實際開跑（台灣時間）
    #   30 6          14:30 收盤後首抓    21:30～00:40
    #   15 10         18:15               00:30～04:45
    #   0 14          22:00（每日步驟）    03:00～07:15（隔天）
    #   0 1           隔天 09:00 補抓      13:15～16:00 ← 實際上成了「當天第一班」
    # 所以下面的台灣時間是設計值，不是使用者看得到資料的時間。能確定的只有兩件事：
    # 班次夠多、而且每一班都冪等（抓到的還是舊資料就不 commit）。
    # 「0 1」那班原本只排週二到週六（當成隔天早上的補抓），於是**週一沒有當天的班**——
    # 週一收盤的資料要到週二 00:40 才上線（2026-11-09 實測）。改成週一也排：延遲還在的話
    # 它是週一下午的第一班；哪天 GitHub 準時了，它在 09:00 跑、抓到的是前一天、不 commit，無害。
    # TWSE OpenAPI STOCK_DAY_ALL 的發佈時間也不固定（實測 2026-07-28 收盤後 6.7 小時仍是前一日），
    # 這是原本排四班的理由，仍然成立。
    - cron: "30 6 * * 1-5"   # 設計：台灣 14:30 收盤後首抓
    - cron: "15 10 * * 1-5"  # 設計：台灣 18:15
    - cron: "0 14 * * 1-5"   # 設計：台灣 22:00（每日步驟掛在這一班）
    - cron: "0 1 * * 1-6"    # 設計：台灣 09:00 補抓；實際是當天下午的第一班（含週一）

permissions:
  contents: write
  actions: write   # 派工 Pages 部署用；沒有它 gh workflow run 會 403

jobs:
  update-market-feed:
    runs-on: ubuntu-latest
    # 沒有這行，任何一步卡住都會讓 job 等到 GitHub 預設的 6 小時，當班資料跟著卡住。
    # 每一步也各有上限（timeout-minutes），數字取自 2026-11-06～11-10 四班全跑的實測時間、
    # 留兩到十幾倍餘裕。job 的上限要**不小於各步上限的總和**——否則每一步都還在自己的
    # 上限內，整個 job 卻先被砍掉，commit 那一步根本輪不到（workflow-timeouts.test.js 釘住）。
    # 有 continue-on-error 的步驟逾時只是那份參考資料沿用舊檔，行情照常 commit；
    # 被砍時寫到一半的檔案會在「Validate feed schemas」被擋下，什麼都不推。
    # 正常最久的是手動派工（每日步驟全跑）：約 10 分鐘，2026-10-20 那次 25 分鐘。
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
      - uses: actions/setup-node@v5
        timeout-minutes: 3
        with:
          node-version: "24"
      # 實測 33–54 秒。這一步沒有 continue-on-error：逾時就是整班失敗、什麼都不推，
      # 跟上游掛掉一樣保留上一份好資料。
      - name: Generate market feed
        timeout-minutes: 15
        run: node scripts/update-market-feed.mjs --emit-bulk /tmp/bulk.json
      # 成分股：官方無此資料，只能解析 MoneyDJ；每週一「15 10」那一班才跑（成分股月頻變動，
      # 且這是最脆弱的一段）。原本只判斷「今天是不是週一」，於是週一的每一班都跑——
      # 2026-11-09 三班各抓一次 358 頁、各 5 分鐘。現在綁定單一 cron，一週就一次。
      # 「是不是週一那一班」看的是**這一班原訂的時段**，不是開跑當下的星期：把現在往回推
      # 10 小時 15 分（＝cron 的 10:15Z），落在週一就是週一 10:15Z 那個時段派出來的。
      # 這一班實際開跑在週一 16:30Z～20:45Z（見上面排程延遲的說明），直接看 UTC 星期的話
      # 再晚 3 個多小時就跨到週二、那一週整個跳過；這樣寫可以容忍到晚 24 小時。
      # 放在 ETF feed 之前，讓當班就能把新成分股併進 feed。
      # 成功率低於 50% 時腳本自己會拒絕覆寫，避免上游改版洗掉好資料。
      # 實測 4 分 57 秒～5 分 45 秒（358 檔逐一抓 MoneyDJ）。
      - name: Refresh ETF holdings (Mondays only)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "${{ github.event.schedule }}" = "15 10 * * 1-5" ] && [ "$(date -u -d '615 minutes ago' +%u)" = "1" ]; }; then
            node scripts/fetch-etf-holdings.mjs
          else
            echo "Not Monday — skipping the weekly holdings scrape"
          fi
      # 配息歷史增量刷新。官方來源涵蓋不全（實測 2026-07-30：TWSE etfDiv 只有 95 檔、
      # 且 00888 這種有配息的上市 ETF 不在內；TPEX 預告表只 21 筆），
      # 207 檔有配息紀錄的 ETF 裡 112 檔完全靠 Yahoo。這支工具原本只能手動跑，
      # 那 112 檔的配息就凍結在最後一次手動執行、並隨 13 個月窗逐筆消失。
      # 一天跑一班（台灣 22:00）就夠——配息都是提前公告的。必須排在 ETF feed 之前，
      # 否則新事件要等下一班才會進 feed 的 dps/殖利率。
      # 實測約 1 分 10 秒。每 100 檔存一次完整的檢查點，中途被砍也是一份能用的檔。
      - name: Refresh ETF dividend history (once daily)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/seed-etf-div-history.mjs --incremental
          else
            echo "Not the 22:00 slot — skipping the daily dividend refresh"
          fi
      # 課稅級距自動抓取（台北國稅局「適用稅率」是真的 HTML 表格，非 PDF 附件），
      # 寫入前必須通過定義性驗證：每個級距交界處兩式必須算出同一個數。
      # 抵減率、免稅額／扣除額、二代健保、最低稅負仍為人工維護，不在該表內。
      # 驗證不過或線上與現存衝突會 exit 1，但不擋 feed 更新（容錯），由 log 提醒。
      - name: Refresh tax brackets (once daily)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/update-tax-params.mjs
          else
            echo "Not the 22:00 slot — skipping the tax bracket refresh"
          fi
      # 個股 → 產業別對照（TWSE ISIN，Big5）。ETF 的 topHoldings 只有名稱與權重，
      # 沒有這張表就算不出產業集中度。產業別月頻變動，一天一次即可；
      # 必須排在 ETF feed 之前，當班才併得進 sectorMix。
      # 解析列數低於前次 70% 時腳本自己拒絕覆寫，上游改版不會洗掉好資料。
      # 2026-11-10 那班 ISIN 上市頁抓了 9 分 37 秒，這一步拖住整條管線 12 分半。
      # 腳本每頁 2 分鐘就放棄（兩頁同時抓）、留著舊表；這裡的 5 分鐘是後備。
      - name: Refresh industry map (once daily)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/update-industry-map.mjs
          else
            echo "Not the 22:00 slot — skipping the daily industry map refresh"
          fi
      # ETF 近一年總報酬（Yahoo adjclose）。配置產生器要以「最終賺多少」為目標
      # 就需要價差那一半——feed 自己只有配息。一天一次即可（報酬是年度尺度），
      # 排在 ETF feed 之前讓當班就併得進去。351 檔 × ~120ms 約 2 分鐘。
      # 失敗容錯：拿不到就沿用上次的 etf-returns.json，ETF feed 照樣產生。
      - name: Refresh ETF 1-year returns (once daily)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/update-etf-returns.mjs
          else
            echo "Not the 22:00 slot — skipping the daily return refresh"
          fi
      # 無風險利率（Sharpe／Sortino 的分母）。央行重貼現率一年動不到一次，
      # 但**必須排進來**：只在本機跑過一次的話，下次央行調整時畫面會靜靜沿用舊利率。
      # 排在 ETF feed 之前，當班就併得進 feed。
      - name: Refresh risk-free rate (once daily)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/update-risk-free.mjs
          else
            echo "Not the 22:00 slot — skipping the daily risk-free refresh"
          fi
      # ETF 引擎失敗不得連坐個股 feed：這步容錯。ETF 檔案維持上次 commit 的內容，
      # 下一步的 schema 驗證會檢查那份舊檔並通過，個股 feed 照常更新。
      - name: Generate ETF feed
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/update-etf-feed.mjs --bulk /tmp/bulk.json
      # 驗證兩份 feed（含逐市場筆數下限）。原本 commit 步驟掛 if: always()，
      # 驗證失敗仍會把劣化資料推上去；改為驗證是 commit 的前置條件——
      # 失敗時什麼都不推，保留上一次的好資料，並讓這班 CI 紅燈。
      # data-artifact-schema.test.js 蓋的是 etf-schema 沒蓋到的那四份：
      # market-52w（hi52/lo52 的定義性檢查與保留界線）、etf-returns、
      # industry-map、risk-free。它們同樣是這一班寫出來、直接上線的。
      - name: Validate feed schemas
        timeout-minutes: 5
        run: node --test backend/test/etf-schema.test.js backend/test/data-artifact-schema.test.js
      # 推送最多重試三次（中間各睡 15／30 秒），加上派工部署，最壞約一分半。
      - name: Commit feed updates
        timeout-minutes: 5
        run: |
          # 只納入實際存在的檔案：holdings 首次執行前不存在，git diff 會報錯
          FILES=""
          for f in data/market-feed.json data/market-52w.json data/etf-feed.json data/etf-div-history.json data/etf-holdings.json data/etf-returns.json data/industry-map.json data/risk-free.json data/tax-params.json; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          if git diff --quiet -- $FILES; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update market and ETF feeds"
          # 推送前先跟上遠端：stock-risk 交易時段每 30 分鐘 commit 一次、market 一天四班，
          # 再加上手動推版，直接 push 會互撞——實測 2026-10-19 15:13（stock-risk）與
          # 2026-10-20 01:35（market）各掉了一班資料，錯誤都是 rejected (fetch first)。
          # 兩支動的檔案不重疊，rebase 不會衝突；失敗就先退出 rebase 再重試。
          pushed=""
          for attempt in 1 2 3; do
            if git pull --rebase --quiet && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          [ -n "$pushed" ] || { echo "push failed after 3 attempts"; exit 1; }
          # **這一步是資料能不能上線的關鍵。** 以 GITHUB_TOKEN 推出的 commit
          # 依 GitHub 規則不會觸發 on:push 的 workflow，所以 pages-deploy 收不到，
          # 資料進得了 repo 卻上不了線——實測線上曾停在 3 天前的 tradeDate，
          # 而 repo 已是當日。必須顯式派工。
          # 放在這裡（而不是另開一步）是因為上面無變更時就 exit 0 了，
          # 天然只有真的 commit 出去才會部署。
          gh workflow run pages-deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
