name: Update market feed

on:
  workflow_dispatch:
  schedule:
    # 台灣 14:30 收盤後首抓、18:15 補抓（TWSE OpenAPI 常落後）
    - cron: "30 6 * * 1-5"
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

jobs:
  update-market-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Generate market feed
        run: node scripts/update-market-feed.mjs --emit-bulk /tmp/bulk.json
      # ETF 引擎失敗不得連坐個股 feed：這步容錯，commit 步驟改 if: always()
      - name: Generate ETF feed
        continue-on-error: true
        run: node scripts/update-etf-feed.mjs --bulk /tmp/bulk.json
      - name: Commit feed updates
        if: always()
        run: |
          FILES="data/market-feed.json data/market-52w.json data/etf-feed.json data/etf-div-history.json"
          if git diff --quiet -- $FILES; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update market and ETF feeds"
          git push
