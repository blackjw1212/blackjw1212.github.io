name: Update market feed

on:
  workflow_dispatch:
  schedule:
    # TWSE OpenAPI STOCK_DAY_ALL 的發佈時間不固定且可能很晚：
    # 實測 2026-07-28T12:13Z（台灣 20:13、收盤後 6.7 小時）仍只提供 1150727 的資料，
    # 導致該班寫出的 tradeDate 停在前一日。因此排四班，最後一班晚到台灣 22:00，
    # 再加一班隔日早上補抓，確保前一交易日的資料一定會被收進來。
    - cron: "30 6 * * 1-5"   # 台灣 14:30 收盤後首抓
    - cron: "15 10 * * 1-5"  # 台灣 18:15
    - cron: "0 14 * * 1-5"   # 台灣 22:00
    - cron: "0 1 * * 2-6"    # 台灣次日 09:00 補抓（涵蓋週五收盤 → 週六早上）

permissions:
  contents: write
  actions: write   # 派工 Pages 部署用；沒有它 gh workflow run 會 403

jobs:
  update-market-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Generate market feed
        run: node scripts/update-market-feed.mjs --emit-bulk /tmp/bulk.json
      # 成分股：官方無此資料，只能解析 MoneyDJ；每週一 18:15 那班才跑（成分股月頻變動，
      # 且這是最脆弱的一段）。放在 ETF feed 之前，讓當班就能把新成分股併進 feed。
      # 成功率低於 50% 時腳本自己會拒絕覆寫，避免上游改版洗掉好資料。
      - name: Refresh ETF holdings (Mondays only)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            node scripts/fetch-etf-holdings.mjs
          else
            echo "Not Monday — skipping the weekly holdings scrape"
          fi
      # 配息歷史增量刷新。官方來源涵蓋不全（實測 2026-07-30：TWSE etfDiv 只有 95 檔、
      # 且 00888 這種有配息的上市 ETF 不在內；TPEX 預告表只 21 筆），
      # 207 檔有配息紀錄的 ETF 裡 112 檔完全靠 Yahoo。這支工具原本只能手動跑，
      # 那 112 檔的配息就凍結在最後一次手動執行、並隨 13 個月窗逐筆消失。
      # 一天跑一班（台灣 22:00）就夠——配息都是提前公告的。必須排在 ETF feed 之前，
      # 否則新事件要等下一班才會進 feed 的 dps/殖利率。
      - name: Refresh ETF dividend history (once daily)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/seed-etf-div-history.mjs --incremental
          else
            echo "Not the 22:00 slot — skipping the daily dividend refresh"
          fi
      # 課稅級距自動抓取（台北國稅局「適用稅率」是真的 HTML 表格，非 PDF 附件），
      # 寫入前必須通過定義性驗證：每個級距交界處兩式必須算出同一個數。
      # 抵減率、免稅額／扣除額、二代健保、最低稅負仍為人工維護，不在該表內。
      # 驗證不過或線上與現存衝突會 exit 1，但不擋 feed 更新（容錯），由 log 提醒。
      - name: Refresh tax brackets (once daily)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/update-tax-params.mjs
          else
            echo "Not the 22:00 slot — skipping the tax bracket refresh"
          fi
      # 個股 → 產業別對照（TWSE ISIN，Big5）。ETF 的 topHoldings 只有名稱與權重，
      # 沒有這張表就算不出產業集中度。產業別月頻變動，一天一次即可；
      # 必須排在 ETF feed 之前，當班才併得進 sectorMix。
      # 解析列數低於前次 70% 時腳本自己拒絕覆寫，上游改版不會洗掉好資料。
      - name: Refresh industry map (once daily)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/update-industry-map.mjs
          else
            echo "Not the 22:00 slot — skipping the daily industry map refresh"
          fi
      # ETF 近一年總報酬（Yahoo adjclose）。配置產生器要以「最終賺多少」為目標
      # 就需要價差那一半——feed 自己只有配息。一天一次即可（報酬是年度尺度），
      # 排在 ETF feed 之前讓當班就併得進去。351 檔 × ~120ms 約 2 分鐘。
      # 失敗容錯：拿不到就沿用上次的 etf-returns.json，ETF feed 照樣產生。
      - name: Refresh ETF 1-year returns (once daily)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/update-etf-returns.mjs
          else
            echo "Not the 22:00 slot — skipping the daily return refresh"
          fi
      # 無風險利率（Sharpe／Sortino 的分母）。央行重貼現率一年動不到一次，
      # 但**必須排進來**：只在本機跑過一次的話，下次央行調整時畫面會靜靜沿用舊利率。
      # 排在 ETF feed 之前，當班就併得進 feed。
      - name: Refresh risk-free rate (once daily)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            node scripts/update-risk-free.mjs
          else
            echo "Not the 22:00 slot — skipping the daily risk-free refresh"
          fi
      # ETF 引擎失敗不得連坐個股 feed：這步容錯。ETF 檔案維持上次 commit 的內容，
      # 下一步的 schema 驗證會檢查那份舊檔並通過，個股 feed 照常更新。
      - name: Generate ETF feed
        continue-on-error: true
        run: node scripts/update-etf-feed.mjs --bulk /tmp/bulk.json
      # 驗證兩份 feed（含逐市場筆數下限）。原本 commit 步驟掛 if: always()，
      # 驗證失敗仍會把劣化資料推上去；改為驗證是 commit 的前置條件——
      # 失敗時什麼都不推，保留上一次的好資料，並讓這班 CI 紅燈。
      - name: Validate feed schemas
        run: node --test backend/test/etf-schema.test.js
      - name: Commit feed updates
        run: |
          # 只納入實際存在的檔案：holdings 首次執行前不存在，git diff 會報錯
          FILES=""
          for f in data/market-feed.json data/market-52w.json data/etf-feed.json data/etf-div-history.json data/etf-holdings.json data/etf-returns.json data/industry-map.json data/risk-free.json data/tax-params.json; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          if git diff --quiet -- $FILES; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update market and ETF feeds"
          git push
          # **這一步是資料能不能上線的關鍵。** 以 GITHUB_TOKEN 推出的 commit
          # 依 GitHub 規則不會觸發 on:push 的 workflow，所以 pages-deploy 收不到，
          # 資料進得了 repo 卻上不了線——實測線上曾停在 3 天前的 tradeDate，
          # 而 repo 已是當日。必須顯式派工。
          # 放在這裡（而不是另開一步）是因為上面無變更時就 exit 0 了，
          # 天然只有真的 commit 出去才會部署。
          gh workflow run pages-deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
