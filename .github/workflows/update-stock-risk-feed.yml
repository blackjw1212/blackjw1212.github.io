name: Update stock risk feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 0-10 * * 1-5"
    - cron: "15 22 * * 1-5"

permissions:
  contents: write
  actions: write   # 派工 Pages 部署用；沒有它 gh workflow run 會 403

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Generate stock risk feed
        run: node scripts/update-stock-risk-feed.mjs
      # 驗證是 commit 的前置條件，不是事後報告——比照 update-market-feed.yml 的
      # 同一段。這一步原本不存在：這支 workflow 直接 git add → commit → push，
      # 劣化的 feed 會靜靜上線。失敗時什麼都不推，保留上一次的好資料，這班紅燈。
      - name: Validate feed schema
        run: node --test backend/test/stock-risk-schema.test.js
      - name: Commit feed update
        run: |
          if git diff --quiet -- data/stock-risk-feed.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-risk-feed.json
          git commit -m "Update stock risk feed"
          git push
          # 見 update-market-feed.yml 的同一段：GITHUB_TOKEN 推的 commit
          # 不會觸發 on:push，不顯式派工的話這份資料永遠上不了線。
          gh workflow run pages-deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
